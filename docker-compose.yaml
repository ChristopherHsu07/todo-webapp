# configuration sheet for all docker files

services:
  app:
    build: . #path to dockerfile on how to build container
    container_name: todo-app
    environment: # environment variables on where/what stuff is
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/todoapp
      - JWT_SECRET=this_is_my_jwt_secret_key
      - NODE_ENV=development
      - PORT=3000
    ports: # match external request to internal port
      - "3000:3000"
    depends_on: # server depends on database
      - db
    volumes: # saves previous state of container
      - .:/app
      - /app/node_modules # protects container's node_modules from being overwritten by host bind mount

  db:
    image: postgres:13-alpine # version for our db
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres # login info, for security
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todoapp
    ports:
      - "5432:5432" # mapping again
    volumes:
      - postgres-data:/var/lib/postgresql/data # where to save data when rebooted

volumes:
  postgres-data: